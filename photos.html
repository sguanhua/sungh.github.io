---
title: 照片
description: Sungh 的照片。
permalink: /photos/
photos: []
---
<header class="page-heading"><h1>照片</h1></header>
{% if page.photos.size > 0 %}
<div class="photo-grid">{% for photo in page.photos %}<figure><a href="{{ photo.src | relative_url }}"><img src="{{ photo.src | relative_url }}" alt="{{ photo.alt | default: photo.caption | escape }}" loading="lazy" decoding="async"></a>{% if photo.caption %}<figcaption>{{ photo.caption | escape }}</figcaption>{% endif %}</figure>{% endfor %}</div>
{% else %}<p class="empty-copy photo-empty">暂无照片。</p>{% endif %}
