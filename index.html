---
title: 首页
description: Sungh 的文字与照片。
---
<section class="home-intro" aria-labelledby="home-title">
  <h1 id="home-title">Sungh</h1>
  <p>文字与照片。</p>
</section>
<section class="recent-section" aria-labelledby="recent-title">
  <div class="section-heading"><h2 id="recent-title">最近文章</h2><a href="{{ '/blog/' | relative_url }}">全部文章 <span aria-hidden="true">↗</span></a></div>
  <div class="post-list">
    {% for post in site.posts limit: 5 %}
    <article class="post-row"><div><h3><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h3>{% if post.description %}<p>{{ post.description | escape }}</p>{% endif %}</div><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y.%m.%d' }}</time></article>
    {% else %}
    <p class="empty-copy">暂无文章。</p>
    {% endfor %}
  </div>
</section>
<section class="simple-section" aria-labelledby="photo-title">
  <div class="section-heading"><h2 id="photo-title">照片</h2><a href="{{ '/photos/' | relative_url }}">查看照片 <span aria-hidden="true">↗</span></a></div>
</section>
